[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ojkit"
version = "0.1.0a1"
description = "Online Judge Kit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Aditya" }
]

dependencies = [
    "requests",
    "beautifulsoup4",
    "InquirerPy",
    "rich",
]

[project.scripts]
ojkit = "ojkit.cli:main"

[tool.setuptools.package-data]
ojkit = ["templates/*.cpp"]
